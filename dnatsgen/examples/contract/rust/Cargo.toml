# Hand-written (NOT generated): the example crate wiring the generated Rust
# (src/contract.rs + src/dnats.rs) so `cargo build` / `cargo test` verify it.
[package]
name = "dnats-contract-example"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
prost = "0.13"
async-nats = "0.49"
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
